# alsa-lib card config for the VIM3 ACPI HDMI sound card.
# Install to /usr/share/alsa/cards/KHADAS-VIM3.conf -- alsa-lib's
# load_for_all_cards hook picks it up by the card's DRIVER name
# ("KHADAS-VIM3"), while the CARD= argument below is the card ID
# ("KHADASVIM3").
#
# Why this file exists: passthrough needs the IEC958 channel-status
# non-PCM bit set before the stream opens, and hdmi-codec registers
# "IEC958 Playback Default" against the codec-to-codec rtd, which is
# PCM device 2 on this card while the playback node is hw:0,0.  Without
# the device index below the ctl_elems hook cannot find the control.
# HDA-Intel.conf solves the identical mismatch with "index 16".
#
# Usage:
#   aplay -D iec958:CARD=KHADASVIM3,AES0=0x06 ac3.spdif
# (0x06 = IEC958_AES0_CON_NOT_COPYRIGHT | IEC958_AES0_NONAUDIO)
#
# NOTE: amixer cannot set an IEC958-type control -- "amixer cset"
# silently no-ops and prints the unchanged value.  Use this plugin, or
# write the element directly (SNDRV_CTL_IOCTL_ELEM_WRITE).

<confdir:pcm/iec958.conf>

KHADAS-VIM3.pcm.iec958.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 0
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				iface PCM
				name "IEC958 Playback Default"
				device 2
				lock true
				preserve true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
		]
	}
	hint.device 0
}
